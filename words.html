<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./words.css">
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo">
            <div class="logo-art">
                <div class="figure-1"></div>
                <div class="figure-2"></div>
                <div class="figure-3"></div>
                <div class="figure-4"></div>
                <div class="figure-5"></div>
            </div>
            <div class="logo-text">quaz.</div>
        </div>

        <!-- Меню -->
        <nav>
            <a class="navigation" href="index.html">Главная</a>
            <a class="navigation" href="labs.html">Лабораторные работы</a>
            <a class="navigation" href="kursach.html">Курсовая</a>
        </nav>
    </header>

    <!-- Основной контент страницы -->
    <main>
        <h1>Лабораторная работа 4: Задание «Слова»</h1>
        <h2>Вариант 2</h2>

        <div class="words-wrapper">
            <!-- Блок 3: Синий блок сверху -->
            <div id="block-3" class="block-3-container">
                <span class="block-badge badge-blue">3</span>
            </div>

            <!-- Нижняя часть: Блок 2 слева, панель управления и Блок 1 справа -->
            <div class="bottom-panels">
                <!-- Блок 2: Левый блок с отсортированными элементами -->
                <div id="block-2" class="block-2-container">
                    <span class="block-badge badge-gray">2</span>
                </div>

                <!-- Правая часть: ввод и Блок 1 -->
                <div class="right-panel">
                    <div class="control-row">
                        <input type="text" id="input-string" class="input-string" value="привет - Как  - ночи – Тишина - 123 - Шансов - нет" placeholder="Введите слова через тире -">
                        <button type="button" id="btn-parse" class="btn-action">Разобрать</button>
                    </div>

                    <!-- Блок 1: Красный блок -->
                    <div id="block-1" class="block-1-container">
                        <span class="block-badge badge-red">1</span>
                        <span class="block-1-empty">Нажмите на слова в синем блоке 3, чтобы они отобразились здесь...</span>
                    </div>

                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button type="button" id="btn-clear-block1" class="btn-action btn-secondary">Очистить блок 1</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Подвал -->
    <footer>
        <p>2026 Выполнил работу студент группы 5130903/40301 Белькович Никита</p>
    </footer>

    <script src="words.js"></script>
